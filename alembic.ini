[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Utilisé uniquement par la CLI alembic en dev (ex: --autogenerate).
# Au runtime, db.py surcharge cette URL avec le vrai chemin du data_dir.
sqlalchemy.url = sqlite:///dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
