[project]
name = "patrimoine"
version = "0.1.0"
description = "Outil local de gestion de patrimoine personnel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "pyzipper>=0.3.6",
    "keyring>=25.5",
    "httpx>=0.27",
]

[project.scripts]
patrimoine = "patrimoine.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patrimoine"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions", "alembic/env.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: formatage de ligne non forcé ici. B008: Depends(...)/Form(...) en défaut
# d'argument est l'idiome FastAPI standard, pas un bug. UP042: (str, Enum) reste
# volontairement utilisé (compatibilité SQLAlchemy/SQLModel mieux éprouvée que StrEnum).
ignore = ["E501", "B008", "UP042"]
