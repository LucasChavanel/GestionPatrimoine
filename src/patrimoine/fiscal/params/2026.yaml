# Traitement de chaque catégorie de charge par régime : deductible / non_deductible /
# immobilisation / immobilisation_si_seuil / non_applicable / a_qualifier.
# Limite assumée : travaux_amelioration regroupe amélioration ET agrandissement/
# construction alors que la spec les distingue pour le foncier réel (amélioration
# déductible, agrandissement non simplement déductible) — traité uniformément
# comme déductible faute de cas d'usage réel, à affiner si besoin.
# Source : Spec module locatif 2026-10-04 — à vérifier.
categories_charges:
  copro_courantes: { lmnp_reel: deductible, foncier_reel: deductible }
  copro_regularisation: { lmnp_reel: deductible, foncier_reel: deductible }
  fonds_travaux: { lmnp_reel: non_deductible, foncier_reel: non_deductible }
  taxe_fonciere: { lmnp_reel: deductible, foncier_reel: deductible }
  assurance_pno: { lmnp_reel: deductible, foncier_reel: deductible }
  frais_gestion: { lmnp_reel: deductible, foncier_reel: deductible }
  menage_linge: { lmnp_reel: deductible, foncier_reel: non_applicable }
  energie_internet: { lmnp_reel: deductible, foncier_reel: deductible }
  eau: { lmnp_reel: deductible, foncier_reel: deductible }
  entretien_reparation: { lmnp_reel: deductible, foncier_reel: deductible }
  travaux_amelioration: { lmnp_reel: immobilisation, foncier_reel: deductible }
  mobilier: { lmnp_reel: immobilisation_si_seuil, foncier_reel: non_applicable }
  interets_emprunt: { lmnp_reel: deductible, foncier_reel: deductible }
  assurance_emprunteur: { lmnp_reel: deductible, foncier_reel: deductible }
  frais_comptable: { lmnp_reel: deductible, foncier_reel: non_applicable }
  cfe: { lmnp_reel: deductible, foncier_reel: non_applicable }
  autre: { lmnp_reel: a_qualifier, foncier_reel: a_qualifier }
