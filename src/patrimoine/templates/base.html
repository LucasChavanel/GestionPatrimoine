<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Patrimoine{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/pico.min.css" />
